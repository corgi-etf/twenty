name: Publish and install Corgi CRM app in production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish the app, or configure an already verified installed release
        required: true
        default: publish-and-install
        type: choice
        options:
          - publish-and-install
          - configure-telegram
      confirmation:
        description: Type PUBLISH_AND_INSTALL_CORGI_CRM_APP or CONFIGURE_CORGI_CRM_TELEGRAM for the selected operation
        required: true
        type: string
      deployed_sha:
        description: Exact 40-character SHA deployed to both CRM services
        required: true
        type: string
      metadata_bootstrap_run_id:
        description: Successful metadata-bootstrap workflow run ID
        required: true
        type: string
      metadata_bootstrap_run_attempt:
        description: Successful metadata-bootstrap workflow attempt number
        required: true
        type: string
      telegram_enable:
        description: Configure and enable Telegram only after live verification
        required: false
        default: false
        type: boolean
      telegram_test_delivery_enabled:
        description: Opt in to one real Telegram verification message
        required: false
        default: false
        type: boolean
      telegram_test_delivery_confirmation:
        description: Type SEND_TELEGRAM_TEST to confirm the opt-in real message
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: crm-production-deploy
  cancel-in-progress: false

env:
  APP_PATH: packages/twenty-apps/internal/corgi-crm
  AWS_ACCOUNT_ID: '182018075072'
  AWS_REGION: us-east-2
  AWS_ROLE_ARN: arn:aws:iam::182018075072:role/crm-production-github-deploy
  ECS_CLUSTER: crm-production
  ECR_REPOSITORY: crm-production-twenty
  SERVER_SERVICE: crm-production-server
  SERVER_CONTAINER: server
  WORKER_SERVICE: crm-production-worker
  WORKER_CONTAINER: worker
  CORGI_CRM_API_URL: https://crm.corgiinvest.com

jobs:
  publish-and-install:
    name: Guard, publish, install, and verify Corgi CRM app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Validate explicit production approval and revision
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          BOOTSTRAP_RUN_ID: ${{ inputs.metadata_bootstrap_run_id }}
          BOOTSTRAP_RUN_ATTEMPT: ${{ inputs.metadata_bootstrap_run_attempt }}
        run: |
          set -euo pipefail
          if [[ "${OPERATION}" == "configure-telegram" ]]; then
            [[ "${CONFIRMATION}" == "CONFIGURE_CORGI_CRM_TELEGRAM" ]]
          else
            [[ "${OPERATION}" == "publish-and-install" ]]
            [[ "${CONFIRMATION}" == "PUBLISH_AND_INSTALL_CORGI_CRM_APP" ]]
          fi
          [[ "${DEPLOYED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${BOOTSTRAP_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BOOTSTRAP_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          node "${APP_PATH}/scripts/deployment-revision-guard.mjs" \
            "${DEPLOYED_SHA}" "${GITHUB_SHA}"

      - name: Verify exact-SHA metadata bootstrap lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_RUN_ID: ${{ inputs.metadata_bootstrap_run_id }}
          BOOTSTRAP_RUN_ATTEMPT: ${{ inputs.metadata_bootstrap_run_attempt }}
        run: |
          set -euo pipefail
          workflow_json="${RUNNER_TEMP}/metadata-bootstrap-workflow.json"
          run_json="${RUNNER_TEMP}/metadata-bootstrap-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crm-workspace-metadata-bootstrap.yml" > "${workflow_json}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BOOTSTRAP_RUN_ID}/attempts/${BOOTSTRAP_RUN_ATTEMPT}" > "${run_json}"
          workflow_id="$(jq -r '.id' "${workflow_json}")"
          jq -e '
            .name == "Manual CRM workspace metadata bootstrap" and
            .path == ".github/workflows/crm-workspace-metadata-bootstrap.yml" and
            .state == "active" and (.id | type == "number")
          ' "${workflow_json}" >/dev/null
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${BOOTSTRAP_RUN_ID}" \
            --argjson run_attempt "${BOOTSTRAP_RUN_ATTEMPT}" \
            --arg workflow_id "${workflow_id}" \
            --arg deployed_sha "${{ inputs.deployed_sha }}" '
              (.id | tostring) == $run_id and .run_attempt == $run_attempt and
              (.workflow_id | tostring) == $workflow_id and
              .name == "Manual CRM workspace metadata bootstrap" and
              .event == "workflow_dispatch" and .head_branch == "main" and
              .head_repository.full_name == $repository and
              .head_sha == $deployed_sha and
              .status == "completed" and .conclusion == "success"
            ' "${run_json}" >/dev/null

      - name: Download PII-free metadata bootstrap evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crm-workspace-metadata-bootstrap-${{ inputs.metadata_bootstrap_run_id }}-${{ inputs.metadata_bootstrap_run_attempt }}
          path: ${{ runner.temp }}/crm-workspace-metadata-bootstrap
          github-token: ${{ github.token }}
          run-id: ${{ inputs.metadata_bootstrap_run_id }}

      - name: Read the app version from the approved revision
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version | select(type == "string" and length > 0)' "${APP_PATH}/package.json")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install repository dependencies
        uses: ./.github/actions/crm-yarn-install

      - name: Install the Chromium authentication browser
        run: npx playwright install --with-deps chromium

      - name: Configure immediate AWS deployment inspection
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-duration-seconds: 1800
          aws-region: ${{ env.AWS_REGION }}

      - name: Prove every live task uses the approved deployed SHA and runtime configuration
        shell: bash
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        run: |
          set -euo pipefail
          caller_account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "${caller_account}" == "${AWS_ACCOUNT_ID}" ]]
          expected_digest="$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids "imageTag=git-${DEPLOYED_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "${expected_digest}" == sha256:* ]]

          assert_stable_service_tasks() {
            local service="$1"
            local container="$2"
            local service_json="${RUNNER_TEMP}/${service}-service.json"
            local tasks_json="${RUNNER_TEMP}/${service}-tasks.json"
            local task_definition_json="${RUNNER_TEMP}/${service}-task-definition.json"
            local task_arns
            local task_definition
            local desired

            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${service}" > "${service_json}"
            jq -e '
              (.failures | length) == 0 and
              (.services | length) == 1 and
              .services[0].status == "ACTIVE" and
              .services[0].desiredCount > 0 and
              .services[0].runningCount == .services[0].desiredCount and
              .services[0].pendingCount == 0 and
              ([.services[0].deployments[] | select(.status == "PRIMARY")] | length) == 1 and
              ([.services[0].deployments[] | select(.status == "ACTIVE")] | length) == 0
            ' "${service_json}" >/dev/null
            desired="$(jq -r '.services[0].desiredCount' "${service_json}")"
            task_definition="$(jq -er '
              .services[0].taskDefinition
              | select(type == "string" and length > 0)
            ' "${service_json}")"
            aws ecs describe-task-definition \
              --task-definition "${task_definition}" > "${task_definition_json}"
            jq -e \
              --arg container "${container}" '
                ([.taskDefinition.containerDefinitions[]
                  | select(.name == $container)] | length) == 1 and
                ((.taskDefinition.containerDefinitions[]
                  | select(.name == $container)) as $runtime_container |
                  (($runtime_container.environment // [])
                    | map(select(.name == "LOGIC_FUNCTION_TYPE"))) == [{
                      name: "LOGIC_FUNCTION_TYPE",
                      value: "LOCAL"
                    }] and
                  (($runtime_container.environment // [])
                    | map(select(.name == "CODE_INTERPRETER_TYPE"))) == [{
                      name: "CODE_INTERPRETER_TYPE",
                      value: "DISABLED"
                    }]
                )
              ' "${task_definition_json}" >/dev/null
            task_arns="$(aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --service-name "${service}" \
              --desired-status RUNNING \
              --query 'taskArns' \
              --output text)"
            [[ -n "${task_arns}" && "${task_arns}" != "None" ]]
            # shellcheck disable=SC2086
            aws ecs describe-tasks \
              --cluster "${ECS_CLUSTER}" \
              --tasks ${task_arns} > "${tasks_json}"
            jq -e \
              --arg container "${container}" \
              --arg digest "${expected_digest}" \
              --arg task_definition "${task_definition}" \
              --argjson desired "${desired}" '
                (.failures | length) == 0 and
                (.tasks | length) == $desired and
                all(.tasks[]; .lastStatus == "RUNNING") and
                all(.tasks[]; .taskDefinitionArn == $task_definition) and
                all(
                  .tasks[];
                  ([.containers[] | select(
                    .name == $container and
                    .lastStatus == "RUNNING" and
                    .imageDigest == $digest
                  )] | length) == 1
                )
              ' "${tasks_json}" >/dev/null
          }

          assert_stable_service_tasks "${SERVER_SERVICE}" "${SERVER_CONTAINER}"
          assert_stable_service_tasks "${WORKER_SERVICE}" "${WORKER_CONTAINER}"

      - name: Verify metadata bootstrap before app preflight
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: ${{ secrets.CRM_E2E_WORKSPACE_NAME }}
          CRM_WORKSPACE_METADATA_PREREQUISITE_ENABLED: 'true'
          CRM_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          CRM_WORKSPACE_METADATA_BOOTSTRAP_ARTIFACT_PATH: ${{ runner.temp }}/crm-workspace-metadata-bootstrap/bootstrap.json
        run: |
          set -euo pipefail
          export CRM_WORKSPACE_ENV_PATH="$GITHUB_ENV"
          npx nx test:production twenty-e2e-testing -- \
            tests/production/workspaceMetadataBootstrapPrerequisite.production.spec.ts \
            --project=production-chromium

      - name: Verify authenticated tenant environment handoff
        shell: bash
        run: |
          set -euo pipefail
          uuid_pattern='^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          [[ "${CORGI_CRM_EXPECTED_WORKSPACE_ID:-}" =~ ${uuid_pattern} ]]
          [[ "${CORGI_CRM_EXPECTED_USER_WORKSPACE_ID:-}" =~ ${uuid_pattern} ]]

      - name: Acquire a short-lived deployment API key
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: ${{ secrets.CRM_E2E_WORKSPACE_NAME }}
          CORGI_CRM_DEPLOYMENT_KEY_OPERATION: acquire
          CORGI_CRM_DEPLOYMENT_KEY_PATH: ${{ runner.temp }}/corgi-crm-deployment-key.json
        run: >-
          npx nx test:production twenty-e2e-testing --
          tests/production/corgiCrmAppDeploymentKey.production.spec.ts
          --project=production-chromium

      - name: Mask the deployment token for subsequent steps
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          token="$(jq -er '.token | select(type == "string" and length > 0)' "${RUNNER_TEMP}/corgi-crm-deployment-key.json")"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Verify the authenticated production workspace
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
        run: node "${APP_PATH}/scripts/verify-production-install.mjs" target

      - name: Resolve least-privilege role object identifiers
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
        run: |
          set -euo pipefail
          export CORGI_CRM_ROLE_ENV_PATH="$GITHUB_ENV"
          node "${APP_PATH}/scripts/verify-production-install.mjs" role-env

      - name: Verify application role environment handoff
        shell: bash
        run: |
          set -euo pipefail
          uuid_pattern='^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          [[ "${CORGI_CRM_EXPECTED_WORKSPACE_ID:-}" =~ ${uuid_pattern} ]]
          [[ "${CORGI_CRM_WHOLESALER_OBJECT_UNIVERSAL_IDENTIFIER:-}" =~ ${uuid_pattern} ]]
          [[ "${CORGI_CRM_OUTREACH_ACTIVITY_OBJECT_UNIVERSAL_IDENTIFIER:-}" =~ ${uuid_pattern} ]]

      - name: Verify the installed release before configuration-only changes
        if: inputs.operation == 'configure-telegram'
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_EXPECTED_VERSION: ${{ steps.app.outputs.version }}
        run: node "${APP_PATH}/scripts/verify-production-install.mjs" installed

      - name: Publish the private Corgi CRM app
        if: inputs.operation != 'configure-telegram'
        uses: ./.github/actions/deploy-twenty-app
        with:
          api-url: ${{ env.CORGI_CRM_API_URL }}
          api-key: ${{ steps.credential.outputs.token }}
          app-path: ${{ env.APP_PATH }}

      - name: Install or upgrade the Corgi CRM app
        if: inputs.operation != 'configure-telegram'
        uses: ./.github/actions/install-twenty-app
        with:
          api-url: ${{ env.CORGI_CRM_API_URL }}
          api-key: ${{ steps.credential.outputs.token }}
          app-path: ${{ env.APP_PATH }}

      - name: Configure Telegram disabled
        if: ${{ always() && steps.credential.outputs.token != '' }}
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_TELEGRAM_TIME_ZONE: ${{ vars.CORGI_CRM_TELEGRAM_TIME_ZONE }}
        run: node "${APP_PATH}/scripts/configure-telegram.mjs" disabled

      - name: Unregister Telegram provider
        if: ${{ always() && !inputs.telegram_enable && steps.credential.outputs.token != '' }}
        env:
          CORGI_CRM_TELEGRAM_BOT_TOKEN: ${{ secrets.CORGI_CRM_TELEGRAM_BOT_TOKEN }}
          CORGI_CRM_TELEGRAM_LIVE_VERIFICATION_CONFIRM: VERIFY_TELEGRAM_LIVE
        run: node "${APP_PATH}/scripts/verify-telegram-live.mjs" disabled

      - name: Stage Telegram configuration while disabled
        if: inputs.telegram_enable
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_TELEGRAM_BOT_TOKEN: ${{ secrets.CORGI_CRM_TELEGRAM_BOT_TOKEN }}
          CORGI_CRM_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CORGI_CRM_TELEGRAM_WEBHOOK_SECRET }}
          CORGI_CRM_TELEGRAM_OPERATOR_SECRET: ${{ secrets.CORGI_CRM_TELEGRAM_OPERATOR_SECRET }}
          CORGI_CRM_TELEGRAM_LINK_CODES: ${{ secrets.CORGI_CRM_TELEGRAM_LINK_CODES }}
          CORGI_CRM_TELEGRAM_NOTIFICATION_ROUTES: ${{ secrets.CORGI_CRM_TELEGRAM_NOTIFICATION_ROUTES }}
          CORGI_CRM_TELEGRAM_TIME_ZONE: ${{ vars.CORGI_CRM_TELEGRAM_TIME_ZONE }}
          CORGI_CRM_TELEGRAM_DAILY_SUMMARY_TIME: ${{ vars.CORGI_CRM_TELEGRAM_DAILY_SUMMARY_TIME }}
        run: node "${APP_PATH}/scripts/configure-telegram.mjs" stage

      - name: Verify native CRM meeting booking while Telegram is disabled
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: ${{ secrets.CRM_E2E_WORKSPACE_NAME }}
          CRM_MEETING_CANARY_ENABLED: 'true'
          CRM_MEETING_CANARY_CONFIRMATION: VERIFY_NATIVE_CRM_MEETING_WITH_TELEGRAM_DISABLED
          CRM_MEETING_CANARY_OPERATION: ${{ inputs.operation }}
          CRM_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          CORGI_CRM_EXPECTED_VERSION: ${{ steps.app.outputs.version }}
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
        run: >-
          npx nx test:production twenty-e2e-testing --
          tests/production/meetingBooking.maintenance.spec.ts
          --project=production-chromium --no-deps --retries=0

      - name: Register and verify the live Telegram provider
        if: inputs.telegram_enable
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_TELEGRAM_BOT_TOKEN: ${{ secrets.CORGI_CRM_TELEGRAM_BOT_TOKEN }}
          CORGI_CRM_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CORGI_CRM_TELEGRAM_WEBHOOK_SECRET }}
          CORGI_CRM_TELEGRAM_OPERATOR_SECRET: ${{ secrets.CORGI_CRM_TELEGRAM_OPERATOR_SECRET }}
          CORGI_CRM_TELEGRAM_LINK_CODES: ${{ secrets.CORGI_CRM_TELEGRAM_LINK_CODES }}
          CORGI_CRM_TELEGRAM_TIME_ZONE: ${{ vars.CORGI_CRM_TELEGRAM_TIME_ZONE }}
          CORGI_CRM_TELEGRAM_DAILY_SUMMARY_TIME: ${{ vars.CORGI_CRM_TELEGRAM_DAILY_SUMMARY_TIME }}
          CORGI_CRM_TELEGRAM_WEBHOOK_URL: ${{ env.CORGI_CRM_API_URL }}/s/telegram/webhook
          CORGI_CRM_TELEGRAM_LIVE_VERIFICATION_CONFIRM: VERIFY_TELEGRAM_LIVE
          CORGI_CRM_TELEGRAM_SIGNED_CANARY_CONFIRM: RUN_SIGNED_CANARY
          CORGI_CRM_TELEGRAM_TEST_DELIVERY_ENABLED: ${{ inputs.telegram_test_delivery_enabled }}
          CORGI_CRM_TELEGRAM_TEST_DELIVERY_CONFIRM: ${{ inputs.telegram_test_delivery_confirmation }}
          CORGI_CRM_TELEGRAM_TEST_CHAT_ID: ${{ secrets.CORGI_CRM_TELEGRAM_TEST_CHAT_ID }}
        run: node "${APP_PATH}/scripts/verify-telegram-live.mjs" enabled

      - name: Enable verified Telegram configuration
        if: inputs.telegram_enable
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_TELEGRAM_BOT_TOKEN: ${{ secrets.CORGI_CRM_TELEGRAM_BOT_TOKEN }}
          CORGI_CRM_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CORGI_CRM_TELEGRAM_WEBHOOK_SECRET }}
          CORGI_CRM_TELEGRAM_OPERATOR_SECRET: ${{ secrets.CORGI_CRM_TELEGRAM_OPERATOR_SECRET }}
          CORGI_CRM_TELEGRAM_LINK_CODES: ${{ secrets.CORGI_CRM_TELEGRAM_LINK_CODES }}
          CORGI_CRM_TELEGRAM_NOTIFICATION_ROUTES: ${{ secrets.CORGI_CRM_TELEGRAM_NOTIFICATION_ROUTES }}
          CORGI_CRM_TELEGRAM_TIME_ZONE: ${{ vars.CORGI_CRM_TELEGRAM_TIME_ZONE }}
          CORGI_CRM_TELEGRAM_DAILY_SUMMARY_TIME: ${{ vars.CORGI_CRM_TELEGRAM_DAILY_SUMMARY_TIME }}
        run: node "${APP_PATH}/scripts/configure-telegram.mjs" enable

      - name: Verify installed application, trigger, and reconciliation
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_EXPECTED_VERSION: ${{ steps.app.outputs.version }}
        run: node "${APP_PATH}/scripts/verify-production-install.mjs" installed

      - name: Verify installed Telegram contract
        if: inputs.telegram_enable
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_EXPECTED_VERSION: ${{ steps.app.outputs.version }}
        run: node "${APP_PATH}/scripts/verify-production-install.mjs" telegram

      - name: Verify Telegram is disabled
        if: ${{ !inputs.telegram_enable }}
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_EXPECTED_VERSION: ${{ steps.app.outputs.version }}
        run: node "${APP_PATH}/scripts/verify-production-install.mjs" telegram-disabled

      - name: Fail closed after Telegram setup failure
        if: ${{ failure() && inputs.telegram_enable && steps.credential.outputs.token != '' }}
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_CRM_TELEGRAM_BOT_TOKEN: ${{ secrets.CORGI_CRM_TELEGRAM_BOT_TOKEN }}
          CORGI_CRM_TELEGRAM_LIVE_VERIFICATION_CONFIRM: VERIFY_TELEGRAM_LIVE
        run: |
          set +e
          node "${APP_PATH}/scripts/configure-telegram.mjs" disabled
          app_cleanup_status=$?
          provider_cleanup_status=0
          if [[ -n "${CORGI_CRM_TELEGRAM_BOT_TOKEN:-}" ]]; then
            node "${APP_PATH}/scripts/verify-telegram-live.mjs" disabled
            provider_cleanup_status=$?
          fi
          if (( app_cleanup_status != 0 || provider_cleanup_status != 0 )); then
            echo "Telegram fail-closed cleanup did not complete" >&2
            exit 1
          fi

      - name: Revoke the short-lived deployment API key
        if: always()
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: ${{ secrets.CRM_E2E_WORKSPACE_NAME }}
          CORGI_CRM_DEPLOYMENT_KEY_OPERATION: revoke
          CORGI_CRM_DEPLOYMENT_KEY_PATH: ${{ runner.temp }}/corgi-crm-deployment-key.json
        run: >-
          npx nx test:production twenty-e2e-testing --
          tests/production/corgiCrmAppDeploymentKey.production.spec.ts
          --project=production-chromium

      - name: Remove local authentication artifacts
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/corgi-crm-deployment-key.json"
          rm -f /home/runner/.twenty/config.json
          rm -f packages/twenty-e2e-testing/.auth/production-user.json
