name: Publish and install Corgi 13F app in production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PUBLISH_AND_INSTALL_CORGI_THIRTEEN_F_APP
        required: true
        type: string
      release_sha:
        description: Exact reviewed main-branch SHA containing the app release
        required: true
        type: string
      normalized_migration_confirmation:
        description: Type NORMALIZED_THIRTEEN_F_MIGRATION_COMPLETE after the normalized 13F migration succeeds
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crm-production-deploy
  cancel-in-progress: false

env:
  APP_PATH: packages/twenty-apps/internal/corgi-thirteen-f
  CORGI_CRM_API_URL: https://crm.corgiinvest.com
  CORGI_CRM_EXPECTED_WORKSPACE_ID: eabf5d9d-fc99-4acb-b160-710ecb1db996
  CORGI_CRM_EXPECTED_WORKSPACE_NAME: Corgi ETF
  CORGI_THIRTEEN_F_APPLICATION_ID: 38ba5a6a-430e-455a-a27b-fba07af35944
  CORGI_THIRTEEN_F_PAGE_LAYOUT_ID: 6404c75f-c713-4db1-965d-6cf54178a18f
  CORGI_THIRTEEN_F_PAGE_TAB_ID: 2850638f-f58f-4af9-8d06-1e832a14dd33
  CORGI_THIRTEEN_F_PAGE_WIDGET_ID: 4ec5c18e-95ad-4848-8084-d2d41bd21ffc
  CORGI_THIRTEEN_F_NAVIGATION_ID: 9c000341-d6f3-48b8-9731-73c5c295eba3
  CORGI_THIRTEEN_F_COMPANY_FIELD_ID: 3e78cf66-c454-4c70-8ccc-d095eb5b0c20
  CORGI_THIRTEEN_F_COMPANY_COMMAND_ID: 55a697bc-c488-4471-93f5-ece5f58d37bb
  CORGI_THIRTEEN_F_WORKSPACE_FRONT_COMPONENT_ID: ee91c40f-759d-42bd-be49-43f0af07982b
  CORGI_THIRTEEN_F_COMPANY_FRONT_COMPONENT_ID: e202fe49-1d7f-4bb9-9bce-77f15a2322c0
  CORGI_THIRTEEN_F_LOGIC_FUNCTION_ID: a418e514-347d-4f63-a0bb-109bedddfdb1
  CORGI_THIRTEEN_F_API_BASE_URL_VARIABLE_ID: 7c8630fc-233a-42e2-a19b-bd750a597435
  CORGI_THIRTEEN_F_API_READ_TOKEN_VARIABLE_ID: fefc317b-7aa5-4e6a-8ad7-046dd0dd04b5
  CORGI_THIRTEEN_F_WORKSPACE_ID_VARIABLE_ID: 90e85886-1020-4404-a75a-01b76f9207f0
  CORGI_THIRTEEN_F_ROLE_ID: 74e11c1b-ed63-4d94-bf2a-89db86edcf39
  CORGI_THIRTEEN_F_VERSION: 0.3.1

jobs:
  publish-and-install:
    name: Guard, publish, install, and verify Corgi 13F app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Validate explicit production approval and release identity
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          MIGRATION_CONFIRMATION: ${{ inputs.normalized_migration_confirmation }}
        run: |
          set -euo pipefail
          [[ "${CONFIRMATION}" == "PUBLISH_AND_INSTALL_CORGI_THIRTEEN_F_APP" ]]
          [[ "${MIGRATION_CONFIRMATION}" == "NORMALIZED_THIRTEEN_F_MIGRATION_COMPLETE" ]]
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_SHA}" == "${GITHUB_SHA}" ]]
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${CORGI_CRM_EXPECTED_WORKSPACE_ID}" == "eabf5d9d-fc99-4acb-b160-710ecb1db996" ]]
          [[ "${CORGI_CRM_EXPECTED_WORKSPACE_NAME}" == "Corgi ETF" ]]

      - name: Verify the immutable app source contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -er '.name' "${APP_PATH}/package.json")" == "corgi-thirteen-f" ]]
          [[ "$(jq -er '.version' "${APP_PATH}/package.json")" == "${CORGI_THIRTEEN_F_VERSION}" ]]
          constants="${APP_PATH}/src/constants/universal-identifiers.ts"
          for identifier in \
            "${CORGI_THIRTEEN_F_APPLICATION_ID}" \
            "${CORGI_THIRTEEN_F_PAGE_LAYOUT_ID}" \
            "${CORGI_THIRTEEN_F_PAGE_TAB_ID}" \
            "${CORGI_THIRTEEN_F_PAGE_WIDGET_ID}" \
            "${CORGI_THIRTEEN_F_NAVIGATION_ID}" \
            "${CORGI_THIRTEEN_F_COMPANY_FIELD_ID}" \
            "${CORGI_THIRTEEN_F_COMPANY_COMMAND_ID}" \
            "${CORGI_THIRTEEN_F_WORKSPACE_FRONT_COMPONENT_ID}" \
            "${CORGI_THIRTEEN_F_COMPANY_FRONT_COMPONENT_ID}" \
            "${CORGI_THIRTEEN_F_LOGIC_FUNCTION_ID}" \
            "${CORGI_THIRTEEN_F_API_BASE_URL_VARIABLE_ID}" \
            "${CORGI_THIRTEEN_F_API_READ_TOKEN_VARIABLE_ID}" \
            "${CORGI_THIRTEEN_F_WORKSPACE_ID_VARIABLE_ID}" \
            "${CORGI_THIRTEEN_F_ROLE_ID}"; do
            [[ "$(grep -Foc "${identifier}" "${constants}")" == "1" ]]
          done

      - name: Install repository dependencies
        uses: ./.github/actions/crm-yarn-install

      - name: Install the Chromium authentication browser
        run: npx playwright install --with-deps chromium

      - name: Prove the authenticated Corgi ETF tenant
        id: tenant
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: Corgi ETF
          CORGI_THIRTEEN_F_TENANT_ENV_PATH: ${{ runner.temp }}/corgi-thirteen-f-tenant.env
        run: >-
          npx nx test:production twenty-e2e-testing --
          tests/production/corgiThirteenFDeploymentTenant.production.spec.ts
          --project=production-chromium

      - name: Load the verified tenant membership
        shell: bash
        run: |
          set -euo pipefail
          tenant_env="${RUNNER_TEMP}/corgi-thirteen-f-tenant.env"
          [[ -f "${tenant_env}" ]]
          chmod 600 "${tenant_env}"
          # The producer accepts only UUIDs and emits these two fixed keys.
          while IFS= read -r line; do
            [[ "${line}" =~ ^CORGI_CRM_EXPECTED_(WORKSPACE|USER_WORKSPACE)_ID=[0-9a-f-]{36}$ ]]
            printf '%s\n' "${line}" >> "${GITHUB_ENV}"
          done < "${tenant_env}"
          [[ "$(grep -c '^CORGI_CRM_EXPECTED_WORKSPACE_ID=' "${tenant_env}")" == "1" ]]
          [[ "$(grep -c '^CORGI_CRM_EXPECTED_USER_WORKSPACE_ID=' "${tenant_env}")" == "1" ]]

      - name: Acquire a short-lived deployment API key
        id: acquire
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: Corgi ETF
          CORGI_CRM_DEPLOYMENT_KEY_OPERATION: acquire
          CORGI_CRM_DEPLOYMENT_REQUIRE_EXACT_ROLE: 'true'
          CORGI_CRM_DEPLOYMENT_KEY_PATH: ${{ runner.temp }}/corgi-thirteen-f-deployment-key.json
        run: >-
          npx nx test:production twenty-e2e-testing --
          tests/production/corgiCrmAppDeploymentKey.production.spec.ts
          --project=production-chromium

      - name: Mask the short-lived deployment token
        id: credential
        shell: bash
        run: |
          set -euo pipefail
          token="$(jq -er '.token | select(type == "string" and length > 0)' "${RUNNER_TEMP}/corgi-thirteen-f-deployment-key.json")"
          echo "::add-mask::${token}"
          echo "token=${token}" >> "${GITHUB_OUTPUT}"

      - name: Precheck the existing Corgi 13F installation
        id: precheck
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
        run: |
          set -euo pipefail
          export CORGI_THIRTEEN_F_OUTPUT_PATH="${GITHUB_OUTPUT}"
          node packages/twenty-e2e-testing/tests/production/corgiThirteenFAppProduction.mjs \
            precheck

      - name: Publish the private Corgi 13F app
        id: publish
        if: steps.precheck.outputs.publish == 'true'
        uses: ./.github/actions/deploy-twenty-app
        with:
          api-url: ${{ env.CORGI_CRM_API_URL }}
          api-key: ${{ steps.credential.outputs.token }}
          app-path: ${{ env.APP_PATH }}

      - name: Confirm the exact private registration is installable
        if: steps.precheck.outputs.install == 'true'
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
        run: >-
          node packages/twenty-e2e-testing/tests/production/corgiThirteenFAppProduction.mjs
          assert-installable

      - name: Install the exact registered Corgi 13F release
        id: install
        if: steps.precheck.outputs.install == 'true'
        uses: ./.github/actions/install-twenty-app
        with:
          api-url: ${{ env.CORGI_CRM_API_URL }}
          api-key: ${{ steps.credential.outputs.token }}
          app-path: ${{ env.APP_PATH }}

      - name: Upgrade the existing Corgi 13F installation in place
        id: upgrade
        if: steps.precheck.outputs.upgrade == 'true'
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: Corgi ETF
          CORGI_THIRTEEN_F_USER_SESSION_UPGRADE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CORGI_CRM_EXPECTED_USER_WORKSPACE_ID:-}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          npx nx test:production twenty-e2e-testing -- \
            tests/production/corgiThirteenFUserSessionUpgrade.production.spec.ts \
            --project=production-chromium

      - name: Configure the Corgi 13F application variables
        id: configure
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_THIRTEEN_F_API_READ_TOKEN: ${{ secrets.CORGI_THIRTEEN_F_API_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${CORGI_THIRTEEN_F_API_READ_TOKEN}" ]]
          printf '::add-mask::%s\n' "${CORGI_THIRTEEN_F_API_READ_TOKEN}"
          node packages/twenty-e2e-testing/tests/production/corgiThirteenFAppProduction.mjs \
            configure

      - name: Verify the installed Corgi 13F native workspace
        id: verify
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
          CORGI_THIRTEEN_F_API_READ_TOKEN: ${{ secrets.CORGI_THIRTEEN_F_API_READ_TOKEN }}
        run: >-
          node packages/twenty-e2e-testing/tests/production/corgiThirteenFAppProduction.mjs
          verify

      - name: Verify the live Corgi 13F data plane
        id: data-plane
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: Corgi ETF
          CORGI_THIRTEEN_F_DATA_PLANE_SMOKE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CORGI_CRM_EXPECTED_WORKSPACE_ID:-}" == "eabf5d9d-fc99-4acb-b160-710ecb1db996" ]]
          [[ "${CORGI_CRM_EXPECTED_USER_WORKSPACE_ID:-}" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          npx nx test:production twenty-e2e-testing -- \
            tests/production/corgiThirteenFDataPlaneSmoke.production.spec.ts \
            --project=production-chromium

      - name: Roll back only this run's fresh installation and retain registration
        if: ${{ always() && steps.precheck.outputs.fresh_install == 'true' && steps.install.outcome == 'success' && (steps.configure.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.data-plane.outcome == 'failure') && steps.credential.outputs.token != '' }}
        env:
          CORGI_CRM_API_KEY: ${{ steps.credential.outputs.token }}
        run: >-
          node packages/twenty-e2e-testing/tests/production/corgiThirteenFAppProduction.mjs
          rollback

      - name: Revoke the short-lived deployment API key
        if: ${{ always() && steps.acquire.outcome != 'skipped' }}
        env:
          FRONTEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          BACKEND_BASE_URL: ${{ env.CORGI_CRM_API_URL }}
          CRM_E2E_LOGIN: ${{ secrets.CRM_E2E_LOGIN }}
          CRM_E2E_PASSWORD: ${{ secrets.CRM_E2E_PASSWORD }}
          CRM_E2E_WORKSPACE_NAME: Corgi ETF
          CORGI_CRM_DEPLOYMENT_KEY_OPERATION: revoke
          CORGI_CRM_DEPLOYMENT_KEY_PATH: ${{ runner.temp }}/corgi-thirteen-f-deployment-key.json
        run: >-
          npx nx test:production twenty-e2e-testing --
          tests/production/corgiCrmAppDeploymentKey.production.spec.ts
          --project=production-chromium

      - name: Remove local authentication artifacts
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/corgi-thirteen-f-deployment-key.json"
          rm -f "${RUNNER_TEMP}/corgi-thirteen-f-tenant.env"
          rm -f /home/runner/.twenty/config.json
          rm -f packages/twenty-e2e-testing/.auth/production-user.json
